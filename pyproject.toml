[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-workspace"
version = "0.1.0"
description = "One root for every agents domain: memory, traces, schedules, personas, relay state"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lolaplex" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["agents", "workspace", "paths", "memory", "traces", "schedules", "personas"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/Lolaplex/agents-workspace"
Repository = "https://github.com/Lolaplex/agents-workspace"
"Bug Tracker" = "https://github.com/Lolaplex/agents-workspace/issues"

[project.scripts]
agents-workspace = "agents_workspace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
